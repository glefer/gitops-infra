---
- name: Fetch k3s kubeconfig
  hosts: app
  gather_facts: false
  become: true

  vars:
    local_kubeconfig_path: >-
      {{ lookup('ansible.builtin.env', 'HOME') }}/.kube/cachelab-platform.yaml

  tasks:
    - name: Ensure local kube directory exists
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Read k3s kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig

    - name: Write kubeconfig locally
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig.content | b64decode }}"
        dest: "{{ local_kubeconfig_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false