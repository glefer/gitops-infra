---
- name: Install k3s prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/install-k3s.sh
    owner: root
    group: root
    mode: "0755"

- name: Install k3s
  ansible.builtin.command:
    cmd: /usr/local/src/install-k3s.sh
    creates: /etc/systemd/system/k3s.service
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      --write-kubeconfig-mode={{ k3s_write_kubeconfig_mode }}
      {% for component in k3s_disable_components %}
      --disable={{ component }}
      {% endfor %}

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Wait for Kubernetes API
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get nodes
  register: k3s_nodes
  retries: 12
  delay: 5
  until: k3s_nodes.rc == 0
  changed_when: false
  when: not ansible_check_mode