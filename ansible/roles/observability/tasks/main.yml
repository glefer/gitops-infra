---
- name: Create observability directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ observability_root }}"
    - "{{ observability_root }}/prometheus"
    - "{{ observability_root }}/prometheus/secrets"
    - "{{ observability_root }}/grafana"
    - "{{ observability_root }}/grafana/provisioning"
    - "{{ observability_root }}/grafana/provisioning/datasources"
    - "{{ observability_root }}/loki"
    - "{{ observability_root }}/caddy"
    - "{{ observability_root }}/grafana/provisioning/dashboards"
    - "{{ observability_root }}/grafana/dashboards"
    - "{{ observability_root }}/umami"
    - "{{ observability_root }}/umami/secrets"

- name: Inspect kube-state-metrics password path
  ansible.builtin.stat:
    path: "{{ observability_root }}/prometheus/secrets/kube-state-metrics-password"
  register: kube_state_metrics_password_path

- name: Remove invalid kube-state-metrics password directory
  ansible.builtin.file:
    path: "{{ observability_root }}/prometheus/secrets/kube-state-metrics-password"
    state: absent
  when:
    - kube_state_metrics_password_path.stat.exists
    - kube_state_metrics_password_path.stat.isdir

- name: Render kube-state-metrics password
  ansible.builtin.template:
    src: kube-state-metrics-password.j2
    dest: "{{ observability_root }}/prometheus/secrets/kube-state-metrics-password"
    owner: "65534"
    group: "65534"
    mode: "0400"
  no_log: true

- name: Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ observability_root }}/prometheus/prometheus.yml"
    owner: root
    group: root
    mode: "0644"

- name: Render Loki configuration
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ observability_root }}/loki/loki-config.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Loki

- name: Generate Caddy password hash for Loki
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "{{ caddy_image }}"
      - caddy
      - hash-password
      - --plaintext
      - "{{ loki_basic_auth_password }}"
  register: loki_basic_auth_hash
  changed_when: false
  no_log: true

- name: Render Caddy configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ observability_root }}/caddy/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

- name: Render Grafana Prometheus datasource
  ansible.builtin.template:
    src: grafana-prometheus-datasource.yml.j2
    dest: "{{ observability_root }}/grafana/provisioning/datasources/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana


- name: Render Grafana Loki datasource
  ansible.builtin.template:
    src: grafana-loki-datasource.yml.j2
    dest: "{{ observability_root }}/grafana/provisioning/datasources/loki.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Render Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboard-provider.yml.j2
    dest: "{{ observability_root }}/grafana/provisioning/dashboards/default.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Render Application Health dashboard
  ansible.builtin.template:
    src: grafana/dashboards/application-health.json.j2
    dest: "{{ observability_root }}/grafana/dashboards/application-health.json"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Render Security Edge dashboard
  ansible.builtin.template:
    src: grafana/dashboards/security-edge.json.j2
    dest: "{{ observability_root }}/grafana/dashboards/security-edge.json"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Inspect Umami database password path
  ansible.builtin.stat:
    path: "{{ observability_root }}/umami/secrets/db-password"
  register: umami_db_password_path

- name: Remove invalid Umami database password directory
  ansible.builtin.file:
    path: "{{ observability_root }}/umami/secrets/db-password"
    state: absent
  when:
    - umami_db_password_path.stat.exists
    - umami_db_password_path.stat.isdir

- name: Render Umami database password
  ansible.builtin.template:
    src: umami-db-password.j2
    dest: "{{ observability_root }}/umami/secrets/db-password"
    owner: root
    group: root
    mode: "0400"
  no_log: true

- name: Render Docker Compose
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ observability_root }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Start observability stack
  community.docker.docker_compose_v2:
    project_src: "{{ observability_root }}"
    state: present
    pull: missing

- name: Provision Umami analytics
  ansible.builtin.import_tasks: umami-analytics.yml