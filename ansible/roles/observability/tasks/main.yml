- name: Create observability directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ observability_root }}"
    - "{{ observability_root }}/prometheus"
    - "{{ observability_root }}/grafana"
    - "{{ observability_root }}/grafana/provisioning"
    - "{{ observability_root }}/grafana/provisioning/datasources"

- name: Render Docker Compose
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ observability_root }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ observability_root }}/prometheus/prometheus.yml"
    owner: root
    group: root
    mode: "0644"

- name: Render Grafana datasource
  ansible.builtin.template:
    src: grafana-prometheus-datasource.yml.j2
    dest: "{{ observability_root }}/grafana/provisioning/datasources/prometheus.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start observability stack
  community.docker.docker_compose_v2:
    project_src: "{{ observability_root }}"
    state: present
    pull: missing

- name: Create Prometheus secrets directory
  ansible.builtin.file:
    path: "{{ observability_root }}/prometheus/secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render kube-state-metrics password
  ansible.builtin.template:
    src: kube-state-metrics-password.j2
    dest: "{{ observability_root }}/prometheus/secrets/kube-state-metrics-password"
    owner: root
    group: root
    mode: "0600"
  no_log: true