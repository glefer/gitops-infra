---
- name: Validate hardening configuration
  ansible.builtin.assert:
    that:
      - hardening_admin_user | length > 0
      - hardening_admin_public_key | length > 0
    fail_msg: "Hardening admin user and public SSH key must be configured."

- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present

- name: Create platform administrator
  ansible.builtin.user:
    name: "{{ hardening_admin_user }}"
    groups: "{{ hardening_admin_groups }}"
    append: true
    shell: "{{ hardening_admin_shell }}"
    create_home: true
    password_lock: true
    state: present

- name: Create administrator SSH directory
  ansible.builtin.file:
    path: "/home/{{ hardening_admin_user }}/.ssh"
    state: directory
    owner: "{{ hardening_admin_user }}"
    group: "{{ hardening_admin_user }}"
    mode: "0700"

- name: Install administrator SSH public key
  ansible.builtin.copy:
    content: "{{ hardening_admin_public_key | trim }}\n"
    dest: "/home/{{ hardening_admin_user }}/.ssh/authorized_keys"
    owner: "{{ hardening_admin_user }}"
    group: "{{ hardening_admin_user }}"
    mode: "0600"

- name: Allow administrator to use sudo without password
  ansible.builtin.copy:
    content: "{{ hardening_admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ hardening_admin_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: Configure SSH hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no

      X11Forwarding no
      AllowAgentForwarding no
      PermitTunnel no

      LoginGraceTime 30
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
  notify: Validate and reload ssh