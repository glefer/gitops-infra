---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow configured TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled