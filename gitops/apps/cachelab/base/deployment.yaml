apiVersion: apps/v1
kind: Deployment

metadata:
  name: cachelab
  labels:
    app.kubernetes.io/name: cachelab
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cachelab

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: cachelab

  template:
    metadata:
      labels:
        app.kubernetes.io/name: cachelab
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cachelab
        observability.cachelab.fr/environment: staging

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: frontend
          image: ghcr.io/glefer/cachelab-frontend@sha256:f5168b317e8d0e7a38152c236c1749559bda0898b150131cb7f663557e374c44

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: UMAMI_SCRIPT_URL
              value: "https://analytics.glefer.fr/script.js"

            - name: UMAMI_WEBSITE_ID
              value: "e7ee081a-0a9e-4efc-ba92-ccbf550ea93a"

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi