apiVersion: apps/v1
kind: Deployment
metadata:
  name: cachelab
  labels:
    app.kubernetes.io/name: cachelab
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cachelab

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: cachelab

  template:
    metadata:
      labels:
        app.kubernetes.io/name: cachelab
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cachelab
        observability.cachelab.fr/environment: staging

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: frontend
          image: ghcr.io/glefer/cachelab-frontend@sha256:34fc6cebad9c8817773441805f56eb7e5ef79d1258cf532b9893308fa7c21020

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi