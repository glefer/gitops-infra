apiVersion: apps/v1
kind: Deployment
metadata:
  name: cachelab
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: cachelab

  template:
    metadata:
      labels:
        app.kubernetes.io/name: cachelab

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: frontend
          image: ghcr.io/glefer/cachelab-frontend@sha256:50545480da9f105e58ac229b590fd68dffedfc7b7ed7dc865e379d879f556ddf

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi