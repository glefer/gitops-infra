apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smoke-test
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/glefer/gitops-infra.git
    targetRevision: main
    path: gitops/apps/smoke-test

  destination:
    server: https://kubernetes.default.svc
    namespace: smoke-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true