apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.6.0
    helm:
      values: |
        deployment:
          replicas: 1

        service:
          type: LoadBalancer
          spec:
            externalTrafficPolicy: Local

        ports:
          web:
            expose:
              default: true

          websecure:
            expose:
              default: true

        providers:
          kubernetesIngress:
            ingressClass: traefik

          kubernetesCRD:
            allowCrossNamespace: false
            allowExternalNameServices: false
            allowEmptyServices: false
            defaultTLSResourcesNamespace: traefik

        additionalArguments:
          - --entryPoints.web.allowACMEByPass=true
          
          # Global HTTP -> HTTPS redirection.
          - --entryPoints.web.http.redirections.entryPoint.to=:443
          - --entryPoints.web.http.redirections.entryPoint.scheme=https
          - --entryPoints.web.http.redirections.entryPoint.permanent=true

          # Fail closed on conflicting TLS options.
          - --core.strictTLSOptions=true

          # Explicitly refuse trusting arbitrary forwarded headers.
          - --entryPoints.web.forwardedHeaders.insecure=false
          - --entryPoints.websecure.forwardedHeaders.insecure=false

          # Access logs.
          - --accesslog=true
          - --accesslog.format=json
          - --accesslog.fields.headers.defaultmode=drop
          - --accesslog.fields.headers.names.X-Forwarded-For=keep
          - --accesslog.fields.headers.names.X-Real-Ip=keep
          - --accesslog.fields.headers.names.User-Agent=keep
          - --accesslog.fields.headers.names.Referer=keep

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true