apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cachelab-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/glefer/gitops-infra.git
    targetRevision: main
    path: gitops/apps/cachelab/overlays/staging
    plugin:
      name: ksops-v1

  destination:
    server: https://kubernetes.default.svc
    namespace: cachelab-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true