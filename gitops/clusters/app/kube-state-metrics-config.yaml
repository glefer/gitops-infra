apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/glefer/gitops-infra.git
    targetRevision: main
    path: gitops/platform/kube-state-metrics
    plugin:
      name: ksops-v1

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true